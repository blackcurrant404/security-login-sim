    <!DOCTYPE html>
    <head>
        <style>
            body {
                display: flex;
                min-height: 100vh;

                justify-content: center;
                align-items: center;

                background-color: black;
                /* border: 2px solid green; */
                
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                animation: fadeIn 5s;
                /* border: 2px solid red; */
            }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
                
            }

            p {
                font-size: 70px;
                color: gold;
                text-shadow: 0 4px 20px rgba(227, 131, 131, 0.6);;
                    box-shadow: 0 4px 20px rgba(227, 131, 131, 0.6);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <p>WELCOME</p>
        </div>
    </body>
